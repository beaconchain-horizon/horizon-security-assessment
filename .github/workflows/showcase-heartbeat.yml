
on:
  schedule:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Snapshot showcase metadata
        run: |
          mkdir -p .showcase
          cat > .showcase/meta.json <<EOF
          {
            "showcase_url": "https://beaconchain-horizon.github.io/horizon-security-assessment/monitor.html",
            "chain_id": "horizon-core-v1.4"
          }
          cat .showcase/meta.json

      - name: Commit and push
        run: |
          git config user.name "horizon-bot"
          git config user.email "bot@beaconchain-horizon.local"
          if git diff --staged --quiet; then
          else
            git commit -m "chore(showcase): heartbeat — monitor page is live"
          fi
