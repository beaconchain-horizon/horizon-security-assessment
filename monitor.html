<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horizon Chain Monitor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0a1628,#1a2942);color:#eef2ff;font-family:Tahoma,Vazirmatn,sans-serif;line-height:1.8;min-height:100vh;padding:0 0 60px}
.banner{position:sticky;top:0;z-index:99;background:linear-gradient(90deg,#0a1628,#1a2942);border-bottom:1px solid #4f9eff;padding:10px 20px;text-align:center;font-size:13px;overflow-x:auto;white-space:nowrap}
.banner a{color:#4ade80;text-decoration:none;font-weight:700;margin:0 10px}
.banner a.blue{color:#4f9eff}
.banner a.gray{color:#8fa2dc;font-weight:400}
.container{max-width:1200px;margin:30px auto;padding:0 20px}
h1{color:#4f9eff;text-align:center;font-size:1.8rem;margin-bottom:8px}
.sub{text-align:center;color:#8fa2dc;font-size:.85rem;margin-bottom:25px}
.card{background:rgba(20,32,55,.92);border:1px solid rgba(79,158,255,.3);border-radius:16px;padding:24px 28px;margin-bottom:20px}
.card h2{color:#c084fc;font-size:1.1rem;margin-bottom:16px;padding-right:12px;border-right:3px solid #c084fc}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
label{display:block;color:#cbd5e1;font-size:.8rem;margin-bottom:6px}
input{padding:11px 14px;border-radius:10px;border:1px solid rgba(79,158,255,.3);background:rgba(10,22,40,.8);color:#fff;font-family:inherit;font-size:.9rem;width:100%}
input:focus{outline:none;border-color:#4f9eff}
.btn{padding:11px 22px;border:none;border-radius:10px;background:linear-gradient(135deg,#4f9eff,#c084fc);color:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.green{background:linear-gradient(135deg,#4ade80,#22c55e);color:#000}
.btn.gray{background:rgba(30,45,70,.8);border:1px solid rgba(79,158,255,.3);color:#cbd5e1}
.status{padding:12px 16px;border-radius:10px;margin:12px 0;font-size:.9rem;display:none}
.status.ok{background:rgba(74,222,128,.15);border:1px solid #4ade80;color:#4ade80;display:block}
.status.err{background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#ef4444;display:block}
.status.info{background:rgba(79,158,255,.15);border:1px solid #4f9eff;color:#4f9eff;display:block}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.info-box{background:rgba(10,22,40,.7);border-radius:10px;padding:14px 18px;border-right:3px solid #4f9eff}
.info-box .label{color:#8fa2dc;font-size:.75rem;margin-bottom:4px}
.info-box .value{color:#eef2ff;font-size:1.05rem;font-weight:700;word-break:break-all}
.info-box .value.mono{font-family:Consolas,monospace;font-size:.82rem;direction:ltr;text-align:left}
table{width:100%;border-collapse:collapse;margin-top:14px;background:rgba(10,22,40,.5);border-radius:10px;overflow:hidden;display:block;overflow-x:auto}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid rgba(79,158,255,.15);font-size:.83rem;white-space:nowrap}
th{background:rgba(79,158,255,.12);color:#4f9eff;font-weight:700;font-size:.8rem}
td.mono{font-family:Consolas,monospace;font-size:.78rem;direction:ltr;text-align:left}
tr:hover td{background:rgba(79,158,255,.05)}
.tx-type{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.72rem;font-weight:700}
.tx-type.license_issue{background:rgba(74,222,128,.2);color:#4ade80}
.tx-type.license_revoke{background:rgba(239,68,68,.2);color:#ef4444}
.tx-type.operation{background:rgba(192,132,252,.2);color:#c084fc}
.tx-type.sensor_reading{background:rgba(79,158,255,.2);color:#4f9eff}
.empty{text-align:center;color:#8fa2dc;padding:30px;font-size:.9rem}
.footer{text-align:center;color:#8fa2dc;font-size:.8rem;margin-top:40px;padding-top:20px;border-top:1px solid rgba(79,158,255,.15)}
@media(max-width:640px){h1{font-size:1.3rem}.card{padding:18px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="banner">
<span style="background:linear-gradient(135deg,#4f9eff,#c084fc);color:#fff;padding:2px 10px;border-radius:12px;font-weight:700;font-size:11px">v1.4</span>
<a href="index.html">Home</a>
<a href="offline-license.html" class="blue">Offline Signer</a>
<a href="proposal.html">Proposal</a>
<a href="https://github.com/beaconchain-horizon" class="gray">GitHub</a>
</div>
<div class="container">
<h1>Horizon Chain Monitor</h1>
<p class="sub">پایش زنده‌ی بلاک‌چین سازمانی — پرسش مستقیم از Backend</p>
<div class="card">
<h2>🔌 اتصال به Backend</h2>
<div class="row">
<div><label>Backend URL</label><input type="text" id="backendUrl" value="http://localhost:8080" placeholder="http://localhost:8080"></div>
<button class="btn" onclick="connect()">اتصال</button>
</div>
<div id="connectStatus" class="status"></div>
</div>
<div class="card" id="chainInfoCard" style="display:none">
<h2>⛓️ اطلاعات زنجیر</h2>
<div class="info-grid" id="chainInfoGrid"></div>
</div>
<div class="card" id="searchCard" style="display:none">
<h2>🔍 جستجو</h2>
<div class="row">
<div><label>TX ID یا Block Number</label><input type="text" id="searchQuery" placeholder="tx_... یا 0"></div>
<button class="btn green" onclick="search()">جستجو</button>
</div>
<div id="searchStatus" class="status"></div>
<div id="searchResult"></div>
</div>
<div class="card" id="blocksCard" style="display:none">
<h2>📦 بلاک‌های اخیر</h2>
<button class="btn gray" onclick="loadBlocks()">به‌روزرسانی</button>
<div id="blocksList"></div>
</div>
<div class="card" id="txsCard" style="display:none">
<h2>📋 آخرین تراکنش‌ها</h2>
<button class="btn gray" onclick="loadRecentTxs()">به‌روزرسانی</button>
<div id="txsList"></div>
</div>
<div class="footer">© 2026 Horizon Core · Chain Monitor v1.4</div>
</div>
<script>
let BACKEND = 'http://localhost:8080';
function show(id, cls, msg){const el=document.getElementById(id);el.className='status '+cls;el.textContent=msg;}
async function api(path){const r=await fetch(BACKEND+path);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function connect(){
  BACKEND=document.getElementById('backendUrl').value.trim().replace(/\/$/,'');
  show('connectStatus','info','در حال اتصال...');
  try{
    const info=await api('/api/v1/chain/info');
    show('connectStatus','ok','متصل شد — chain_id: '+info.chain_id);
    renderChainInfo(info);
    document.getElementById('chainInfoCard').style.display='block';
    document.getElementById('searchCard').style.display='block';
    document.getElementById('blocksCard').style.display='block';
    document.getElementById('txsCard').style.display='block';
    await loadBlocks();
    await loadRecentTxs();
  }catch(e){show('connectStatus','err','اتصال ناموفق: '+e.message);}
}
function renderChainInfo(info){
  const g=document.getElementById('chainInfoGrid');
  const boxes=[
    {label:'Chain ID',value:info.chain_id,mono:false},
    {label:'ارتفاع (Height)',value:info.height,mono:true},
    {label:'تعداد تراکنش',value:info.tx_total,mono:true},
    {label:'آخرین Hash',value:(info.latest_hash||'').slice(0,24)+'…',mono:true,full:info.latest_hash},
    {label:'آخرین Merkle Root',value:(info.latest_root||'').slice(0,24)+'…',mono:true,full:info.latest_root},
  ];
  g.innerHTML='';
  for(const b of boxes){
    const d=document.createElement('div');
    d.className='info-box';
    d.innerHTML='<div class="label">'+b.label+'</div><div class="value'+(b.mono?' mono':'')+'" title="'+(b.full||'')+'">'+b.value+'</div>';
    g.appendChild(d);
  }
}
async function loadBlocks(){
  try{
    const data=await api('/api/v1/blocks?limit=20');
    const blocks=data.blocks||[];
    if(!blocks.length){document.getElementById('blocksList').innerHTML='<div class="empty">هیچ بلاکی وجود ندارد</div>';return;}
    let html='<table><thead><tr><th>#</th><th>Timestamp (UTC)</th><th>Tx Count</th><th>Merkle Root</th><th>Block Hash</th></tr></thead><tbody>';
    for(const b of blocks){
      const ts=new Date(b.timestamp).toISOString().replace('T',' ').slice(0,19);
      html+='<tr><td class="mono">'+b.number+'</td><td class="mono">'+ts+'</td><td class="mono">'+b.tx_count+'</td><td class="mono">'+(b.merkle_root||'').slice(0,16)+'…</td><td class="mono">'+(b.block_hash||'').slice(0,16)+'…</td></tr>';
    }
    html+='</tbody></table>';
    document.getElementById('blocksList').innerHTML=html;
  }catch(e){document.getElementById('blocksList').innerHTML='<div class="empty">خطا: '+e.message+'</div>';}
}
async function loadRecentTxs(){
  try{
    const data=await api('/api/v1/blocks?limit=5');
    const blocks=data.blocks||[];
    let allTxs=[];
    for(const b of blocks){
      const detail=await api('/api/v1/blocks/'+b.number);
      if(detail.transactions)allTxs=allTxs.concat(detail.transactions);
    }
    if(!allTxs.length){document.getElementById('txsList').innerHTML='<div class="empty">هیچ تراکنشی وجود ندارد</div>';return;}
    let html='<table><thead><tr><th>Block</th><th>TX ID</th><th>Type</th><th>Timestamp (UTC)</th><th>Public Key</th></tr></thead><tbody>';
    for(const t of allTxs){
      const ts=new Date(t.timestamp).toISOString().replace('T',' ').slice(0,19);
      html+='<tr><td class="mono">'+t.block_number+'</td><td class="mono">'+t.tx_id+'</td><td><span class="tx-type '+t.tx_type+'">'+t.tx_type+'</span></td><td class="mono">'+ts+'</td><td class="mono">'+(t.public_key||'').slice(0,16)+'…</td></tr>';
    }
    html+='</tbody></table>';
    document.getElementById('txsList').innerHTML=html;
  }catch(e){document.getElementById('txsList').innerHTML='<div class="empty">خطا: '+e.message+'</div>';}
}
async function search(){
  const q=document.getElementById('searchQuery').value.trim();
  if(!q)return;
  show('searchStatus','info','در حال جستجو...');
  document.getElementById('searchResult').innerHTML='';
  try{
    if(/^\d+$/.test(q)){
      const data=await api('/api/v1/blocks/'+q);
      show('searchStatus','ok','بلاک '+q+' پیدا شد');
      renderBlockDetail(data);
    }else{
      const tx=await api('/api/v1/transactions/'+q);
      show('searchStatus','ok','تراکنش پیدا شد');
      renderTxDetail(tx);
    }
  }catch(e){show('searchStatus','err','پیدا نشد: '+e.message);}
}
function renderBlockDetail(data){
  const b=data.block;
  const ts=new Date(b.timestamp).toISOString().replace('T',' ').slice(0,19);
  let html='<div class="info-grid" style="margin-top:16px">';
  html+='<div class="info-box"><div class="label">Block Number</div><div class="value mono">'+b.number+'</div></div>';
  html+='<div class="info-box"><div class="label">Timestamp (UTC)</div><div class="value mono">'+ts+'</div></div>';
  html+='<div class="info-box"><div class="label">Tx Count</div><div class="value mono">'+b.tx_count+'</div></div>';
  html+='</div>';
  html+='<div class="info-box" style="margin-top:12px"><div class="label">Merkle Root</div><div class="value mono">'+b.merkle_root+'</div></div>';
  html+='<div class="info-box" style="margin-top:12px"><div class="label">Block Hash</div><div class="value mono">'+b.block_hash+'</div></div>';
  document.getElementById('searchResult').innerHTML=html;
}
function renderTxDetail(t){
  const ts=new Date(t.timestamp).toISOString().replace('T',' ').slice(0,19);
  let html='<div class="info-grid" style="margin-top:16px">';
  html+='<div class="info-box"><div class="label">Block</div><div class="value mono">'+t.block_number+'</div></div>';
  html+='<div class="info-box"><div class="label">Type</div><div class="value"><span class="tx-type '+t.tx_type+'">'+t.tx_type+'</span></div></div>';
  html+='<div class="info-box"><div class="label">Timestamp (UTC)</div><div class="value mono">'+ts+'</div></div>';
  html+='</div>';
  html+='<div class="info-box" style="margin-top:12px"><div class="label">TX ID</div><div class="value mono">'+t.tx_id+'</div></div>';
  html+='<div class="info-box" style="margin-top:12px"><div class="label">Merkle Leaf</div><div class="value mono">'+t.merkle_leaf+'</div></div>';
  html+='<div class="info-box" style="margin-top:12px"><div class="label">Signature</div><div class="value mono">'+t.signature+'</div></div>';
  html+='<div class="info-box" style="margin-top:12px"><div class="label">Public Key</div><div class="value mono">'+t.public_key+'</div></div>';
  html+='<div class="info-box" style="margin-top:12px"><div class="label">Merkle Proof</div><div class="value mono" style="font-size:.75rem">'+(t.merkle_proof||'[]')+'</div></div>';
  document.getElementById('searchResult').innerHTML=html;
}
window.addEventListener('load',function(){connect();});
</script>
</body>
</html>
