<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Horizon Core — Offline License Signer v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #0a0e1a;
    color: #e6edf3;
    margin: 0;
    padding: 24px;
    line-height: 1.7;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { color: #58a6ff; font-size: 22px; margin: 0 0 4px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 24px; }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    color: #58a6ff;
    font-size: 15px;
    margin: 0 0 14px;
    font-weight: 600;
  }
  label { display: block; font-size: 13px; color: #8b949e; margin: 12px 0 4px; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #e6edf3;
    font-family: inherit;
    font-size: 13px;
  }
  input:focus, select:focus { outline: none; border-color: #58a6ff; }
  button {
    background: #238636;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    margin-top: 16px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #2ea043; }
  .status {
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 12px;
  }
  .status.ok  { background: #0d419d33; color: #79c0ff; border: 1px solid #1f6feb; }
  .status.err { background: #5d1a1a44; color: #ff7b72; border: 1px solid #f85149; }
  .status.info{ background: #1f6feb22; color: #58a6ff; border: 1px solid #1f6feb; }
  pre {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 12px;
    font-size: 11px;
    overflow-x: auto;
    direction: ltr;
    text-align: left;
    color: #e6edf3;
  }
  #keyInfo {
    white-space: pre-wrap;
    font-size: 12px;
    color: #8b949e;
    margin-top: 10px;
    direction: ltr;
    text-align: left;
  }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .hint { color: #8b949e; font-size: 12px; margin-top: 4px; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    background: #1f6feb33;
    color: #79c0ff;
    margin-right: 6px;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>Horizon Core — Offline License Signer <span class="badge">v2</span></h1>
  <div class="sub">
    کاملاً آفلاین · کلید خصوصی از USB · امضا در RAM · پاک‌سازی بعد از امضا
  </div>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 1. Load private key                             -->
  <!-- ═══════════════════════════════════════════════ -->
  <div class="card">
    <h2>۱. لود کلید خصوصی از USB</h2>
    <label for="keyFile">📁 فایل کلید (HEX-32 یا 0xHEX-32)</label>
    <input type="file" id="keyFile" accept=".txt,.key,.pem,text/plain">
    <div id="keyInfo"></div>
    <div id="keyStatus"></div>
  </div>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 2. License fields                               -->
  <!-- ═══════════════════════════════════════════════ -->
  <div class="card">
    <h2>۲. اطلاعات لایسنس</h2>

    <label for="licId">شناسه لایسنس (License ID)</label>
    <input id="licId" type="text" value="HORIZON-GOLD-001" placeholder="HORIZON-...">

    <label for="userId">سازمان هدف</label>
    <select id="userId">
      <option value="bank-markazi">بانک مرکزی</option>
      <option value="bank-melli">بانک ملی</option>
      <option value="bank-mellat">بانک ملت</option>
      <option value="nicico">صنایع مس</option>
      <option value="foolad">فولاد</option>
      <option value="abadan">پالایشگاه آبادان</option>
      <option value="custom">سازمان دیگر (دستی)</option>
    </select>
    <input id="customUser" type="text" placeholder="user_id" style="display:none;margin-top:6px;">

    <label for="productId">شناسه محصول</label>
    <input id="productId" type="text" value="horizon-core">

    <div class="row">
      <div>
        <label for="volume">حجم (تراکنش مجاز)</label>
        <input id="volume" type="number" value="1000000" min="1">
      </div>
      <div>
        <label for="duration">مدت (روز)</label>
        <input id="duration" type="number" value="365" min="1">
      </div>
    </div>

    <label for="hwid">Hardware ID (اختیاری — خالی = آزاد)</label>
    <input id="hwid" type="text" placeholder="خالی بگذار اگر نمی‌خواهی به سخت‌افزار قفل شود">

    <button id="genBtn" disabled>🔐 تولید لایسنس آفلاین با ECDSA</button>
    <div id="genStatus"></div>
  </div>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- 3. Result                                       -->
  <!-- ═══════════════════════════════════════════════ -->
  <div class="card" id="resultCard" style="display:none;">
    <h2>۳. نتیجه</h2>
    <button id="dlBtn" disabled style="background:#1f6feb;">💾 دانلود فایل لایسنس (.lic)</button>
    <pre id="result"></pre>
  </div>

</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- noble-secp256k1 v2 — pinned, air-gap.                      -->
<!-- برای محیط air-gap این را local نگه دار. برای دموی آنلاین    -->
<!-- از CDN زیر استفاده می‌شود.                                  -->
<!-- ═══════════════════════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/@noble/secp256k1@2.1.0/lib/esm/index.min.js"></script>

<script>
// ═══════════════════════════════════════════════════════════
// v2 signer helpers — MUST match Go internal/license/protocol.go
//
// Go Statement struct field order:
//   LicenseID, UserID, ProductID, Volume, Duration,
//   MerkleRoot, IssuedAt, ExpiresAt, HardwareID
//
// Merkle root computed over 8 leaves (NOT including merkle_root):
//   "license_id=X", "user_id=X", "product_id=X", "volume=X",
//   "duration=X", "issued_at=X", "expires_at=X", "hardware_id=X"
//
// Tree: leaf = SHA256(data), node = SHA256(L||R),
//       odd level self-pairs with itself.
// ═══════════════════════════════════════════════════════════

async function hz_sha256(bytes) {
  return new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
}

function hz_toHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
}

function hz_concat(a, b) {
  const out = new Uint8Array(a.length + b.length);
  out.set(a, 0);
  out.set(b, a.length);
  return out;
}

async function hz_binaryRootNoPrefix(leaves) {
  if (leaves.length === 0) return new Uint8Array(32);
  let level = [];
  for (let i = 0; i < leaves.length; i++) {
    level.push(await hz_sha256(leaves[i]));
  }
  while (level.length > 1) {
    const next = [];
    for (let i = 0; i < level.length; i += 2) {
      const a = level[i];
      const b = (i + 1 < level.length) ? level[i + 1] : level[i];
      next.push(await hz_sha256(hz_concat(a, b)));
    }
    level = next;
  }
  return level[0];
}

async function hz_computeMerkleRoot(st) {
  const e = new TextEncoder();
  const leaves = [
    e.encode('license_id=' + st.license_id),
    e.encode('user_id=' + st.user_id),
    e.encode('product_id=' + st.product_id),
    e.encode('volume=' + st.volume),
    e.encode('duration=' + st.duration),
    e.encode('issued_at=' + st.issued_at),
    e.encode('expires_at=' + st.expires_at),
    e.encode('hardware_id=' + st.hardware_id),
  ];
  return hz_toHex(await hz_binaryRootNoPrefix(leaves));
}

// CanonicalBytes = Go json.Marshal(Statement)
// Keys in struct field order, compact (no spaces).
function hz_canonicalJSON(st) {
  return JSON.stringify({
    license_id:  st.license_id,
    user_id:     st.user_id,
    product_id:  st.product_id,
    volume:      st.volume,
    duration:    st.duration,
    merkle_root: st.merkle_root,
    issued_at:   st.issued_at,
    expires_at:  st.expires_at,
    hardware_id: st.hardware_id,
  });
}

// ═══════════════════════════════════════════════════════════
// DOM helpers
// ═══════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);

function showStatus(id, kind, text) {
  const el = $(id);
  el.className = 'status ' + kind;
  el.textContent = text;
}

// ═══════════════════════════════════════════════════════════
// State — privateKey lives here, wiped after signing
// ═══════════════════════════════════════════════════════════
let privateKey = null;      // Uint8Array(32)
let publicKeyHex = null;    // "0x04..." uncompressed
let lastLicense = null;     // last signed license (for download)

// Wipe helper — called after signing and on page unload.
function wipePrivateKey() {
  try {
    if (privateKey && typeof privateKey.fill === 'function') {
      privateKey.fill(0);
    }
    privateKey = null;
  } catch (e) { /* ignore */ }
}
window.__hz_wipeKey = wipePrivateKey;
window.addEventListener('beforeunload', wipePrivateKey);
window.addEventListener('pagehide', wipePrivateKey);

// ═══════════════════════════════════════════════════════════
// 1. Load key file
// ═══════════════════════════════════════════════════════════
$('keyFile').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    let text = (await file.text()).trim();
    // strip any whitespace/newlines
    text = text.replace(/\s+/g, '');
    // accept optional 0x prefix
    if (text.startsWith('0x') || text.startsWith('0X')) text = text.slice(2);
    if (!/^[0-9a-fA-F]{64}$/.test(text)) {
      throw new Error('کلید باید ۶۴ کاراکتر HEX باشد (۳۲ بایت)');
    }
    const bytes = new Uint8Array(32);
    for (let i = 0; i < 32; i++) {
      bytes[i] = parseInt(text.substr(i * 2, 2), 16);
    }
    // validate scalar in range [1, n-1]
    const secp = window.nobleSecp256k1 || window.secp;
    if (!secp) throw new Error('کتابخانه secp256k1 لود نشد');
    const pub = secp.getPublicKey(bytes, false); // 65-byte uncompressed
    publicKeyHex = '0x' + Array.from(pub).map(b => b.toString(16).padStart(2, '0')).join('');
    privateKey = bytes;

    $('keyInfo').textContent =
      '📄 File: ' + file.name + '\n' +
      '🔑 Format: HEX-32\n' +
      '📍 Public Key: ' + publicKeyHex;
    showStatus('keyStatus', 'ok', '✅ کلید بارگذاری شد — در RAM');
    $('genBtn').disabled = false;
  } catch (err) {
    wipePrivateKey();
    showStatus('keyStatus', 'err', '❌ خطا: ' + (err.message || err.toString()));
  }
});

// ═══════════════════════════════════════════════════════════
// 2. userId dropdown
// ═══════════════════════════════════════════════════════════
$('userId').addEventListener('change', function(e) {
  $('customUser').style.display = e.target.value === 'custom' ? 'block' : 'none';
});

// ═══════════════════════════════════════════════════════════
// 3. Generate license
// ═══════════════════════════════════════════════════════════
$('genBtn').addEventListener('click', async function() {
  if (!privateKey) {
    showStatus('genStatus', 'err', '❌ اول کلید را بارگذاری کن');
    return;
  }
  try {
    showStatus('genStatus', 'info', '⏳ در حال امضا...');

    // --- read form ---
    const licId = $('licId').value.trim();
    const userId = $('userId').value === 'custom'
      ? $('customUser').value.trim()
      : $('userId').value;
    const productId = $('productId').value.trim();
    const volume = parseInt($('volume').value, 10);
    const duration = parseInt($('duration').value, 10);
    const hwid = $('hwid').value.trim();

    if (!licId || !userId || !productId || !volume || !duration) {
      throw new Error('همه فیلدهای اجباری را پر کن');
    }
    if (volume <= 0 || duration <= 0) {
      throw new Error('حجم و مدت باید مثبت باشند');
    }

    const issuedAt = Math.floor(Date.now() / 1000);
    const expiresAt = issuedAt + duration * 86400;

    // --- build Statement WITHOUT merkle_root ---
    const stmtForMerkle = {
      license_id: licId,
      user_id: userId,
      product_id: productId,
      volume: volume,
      duration: duration,
      issued_at: issuedAt,
      expires_at: expiresAt,
      hardware_id: hwid,
    };

    // --- compute merkle root (8 leaves) ---
    const merkleRoot = await hz_computeMerkleRoot(stmtForMerkle);

    // --- full Statement WITH merkle_root ---
    const stmt = {
      license_id: licId,
      user_id: userId,
      product_id: productId,
      volume: volume,
      duration: duration,
      merkle_root: merkleRoot,
      issued_at: issuedAt,
      expires_at: expiresAt,
      hardware_id: hwid,
    };

    // --- CanonicalBytes → SHA-256 → sign ---
    const msg = hz_canonicalJSON(stmt);
    const msgBytes = new TextEncoder().encode(msg);
    const msgHash = await hz_sha256(msgBytes);

    const secp = window.nobleSecp256k1 || window.secp;
    const sigBytes = secp.sign(msgHash, privateKey).toCompactRawBytes();
    const sigHex = hz_toHex(sigBytes);

    // --- envelope (what Switch / Backend expects) ---
    const license = {
      license_id: licId,
      user_id: userId,
      product_id: productId,
      volume: volume,
      used: 0,
      duration: duration,
      signature: sigHex,
      merkle_root: merkleRoot,
      issued_at: issuedAt,
      expires_at: expiresAt,
      status: 'active',
      hardware_id: hwid,
    };
    lastLicense = license;

    // --- wipe key from RAM ---
    wipePrivateKey();
    $('genBtn').disabled = true;
    $('keyInfo').textContent = '🔒 کلید از RAM پاک شد';

    // --- show result ---
    $('resultCard').style.display = 'block';
    $('result').textContent = JSON.stringify(license, null, 2);
    $('dlBtn').disabled = false;
    showStatus('genStatus', 'ok', '✅ لایسنس امضا شد · کلید پاک شد');
  } catch (err) {
    showStatus('genStatus', 'err', '❌ خطا: ' + (err.message || err.toString()));
  }
});

// ═══════════════════════════════════════════════════════════
// 4. Download .lic
// ═══════════════════════════════════════════════════════════
$('dlBtn').addEventListener('click', function() {
  if (!lastLicense) return;
  const blob = new Blob([JSON.stringify(lastLicense, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (lastLicense.license_id || 'license') + '.lic';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// ═══════════════════════════════════════════════════════════
// 5. Sanity — warn if library not loaded
// ═══════════════════════════════════════════════════════════
window.addEventListener('load', function() {
  const secp = window.nobleSecp256k1 || window.secp;
  if (!secp) {
    showStatus('keyStatus', 'err',
      '❌ کتابخانه secp256k1 لود نشد. برای air-gap فایل کتابخانه را کنار این HTML بگذار و src را local کن.');
  }
});
</script>

</body>
</html>
